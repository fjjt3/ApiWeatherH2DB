version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    container_name: weather-api-backend
    environment:
      - JAVA_OPTS=-Xmx512m
    networks:
      - weather-network

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    container_name: weather-api-frontend
    depends_on:
      - backend
    networks:
      - weather-network
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

networks:
  weather-network:
    driver: bridge

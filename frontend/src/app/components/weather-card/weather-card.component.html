<div class="card weather-card h-100 shadow-sm">
  <div class="card-body">
    <h5 class="card-title d-flex align-items-center justify-content-between">
      <span>{{ city }}</span>
      <i class="bi {{ getWeatherIcon() }} fs-2" [ngClass]="getTemperatureClass()"></i>
    </h5>
    
    <div *ngIf="weather; else noData">
      <div class="temperature-display my-3" [ngClass]="getTemperatureClass()">
        <h2 class="display-4 mb-0">{{ weather.temperatura }}°C</h2>
      </div>
      
      <div class="weather-details">
        <div class="detail-item mb-2">
          <i class="bi bi-droplet-fill text-primary"></i>
          <span class="ms-2"><strong>Humedad:</strong> {{ weather.humedad }}%</span>
        </div>
        
        <div class="detail-item mb-2">
          <i class="bi bi-wind text-info"></i>
          <span class="ms-2"><strong>Viento:</strong> {{ weather.velocidadViento }} km/h</span>
        </div>
        
        <div class="detail-item mb-2">
          <i class="bi bi-geo-alt-fill text-secondary"></i>
          <span class="ms-2 small">{{ weather.latitud.toFixed(2) }}, {{ weather.longitud.toFixed(2) }}</span>
        </div>
      </div>
      
      <hr class="my-3">
      
      <div class="text-muted small">
        <i class="bi bi-clock"></i>
        <span class="ms-2">Última actualización:</span>
        <div class="mt-1">{{ formatDate(weather.fechaConsulta) }}</div>
      </div>
    </div>
    
    <ng-template #noData>
      <div class="text-center text-muted py-4">
        <i class="bi bi-cloud-slash fs-1"></i>
        <p class="mt-2">No hay datos disponibles</p>
      </div>
    </ng-template>
  </div>
</div>

# JPA/JDBC Connectivity
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Config
spring.h2.console.enabled=true
# This allows the console to stay open in a browser frame and accessible from host
spring.h2.console.settings.web-allow-others=true
# Force the H2 console to use the same URL as the datasource for convenience (if possible in UI)
# Note: User must still verify the 'JDBC URL' field in the login screen.

# Database Initialization (Spring Boot 2.5+)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop
# Ensures Hibernate finishes creating tables before data.sql runs
spring.jpa.defer-datasource-initialization=true 

# Documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
